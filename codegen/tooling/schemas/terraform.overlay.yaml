overlay: 1.0.0
info:
  title: Terraform shaping for the jambonz REST API
  version: 1.0.0

# What the API *means*, stated once, in the vocabulary Terraform needs: which
# operation is a resource's create, which properties the server owns, which are
# secrets, and where the published description and the implementation disagree.
#
# Every action here must resolve. scripts/overlay.mjs fails the build on any that
# does not, because an overlay whose targets have moved applies nothing, exits 0,
# and reads in review like a contract.
actions:
  # ---- the naming contract ------------------------------------------------
  #
  # cmd/gen looks each operation up by operationId, as create<R>/get<R>/
  # update<R>/delete<R>/list<R>s. Most of the jambonz spec is already written
  # that way; these two are not.
  - target: $.paths['/PhoneNumbers'].post
    description: Canonical create operation for the phone_number resource
    update:
      operationId: createPhoneNumber

  - target: $.paths['/PhoneNumbers'].get
    description: Canonical list operation, read by the phone_numbers data source
    update:
      operationId: listPhoneNumbers

  # And one the spec omits entirely. lib/routes/api/applications.js serves
  # GET /Applications/:sid, but jambonz's swagger documents only the list, the
  # create, the update and the delete -- so cmd/gen fails with
  #
  #   resource "application": the spec declares no operation with
  #   operationId "getApplication"
  #
  # Every resource needs a read: create answers with a bare sid, so the record
  # is fetched back before apply returns. Declaring the operation the server
  # already implements is the smallest true statement; the alternative is
  # listing every application and filtering client-side for one row.
  - target: $.paths['/Applications/{ApplicationSid}']
    description: The single-application GET the implementation serves and the spec omits
    update:
      get:
        tags:
          - Applications
        summary: retrieve an application
        operationId: getApplication
        responses:
          '200':
            description: application found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Application'
          '404':
            description: application not found

  # ---- what the server owns ------------------------------------------------
  #
  # A readOnly property becomes a computed Terraform attribute, and cmd/gen never
  # sends it in a request body. That second half matters here: every jambonz
  # update is a whole-record PUT whose body schema $refs the record — including
  # its own sid — and the API rejects a body that carries it. The Applications
  # update body already works around this by hand-copying the schema minus the
  # sid, with a comment saying why. readOnly states it once, for all five.
  - target: $.components.schemas.Account.properties.account_sid
    description: Server-assigned identifier; the import ID
    update:
      readOnly: true

  - target: $.components.schemas.Application.properties.application_sid
    description: Server-assigned identifier; the import ID
    update:
      readOnly: true

  - target: $.components.schemas.PhoneNumber.properties.phone_number_sid
    description: Server-assigned identifier; the import ID
    update:
      readOnly: true

  - target: $.components.schemas.VoipCarrier.properties.voip_carrier_sid
    description: Server-assigned identifier; the import ID
    update:
      readOnly: true

  - target: $.components.schemas.SipGateway.properties.sip_gateway_sid
    description: Server-assigned identifier; the import ID
    update:
      readOnly: true

  - target: $.components.schemas.Webhook.properties.webhook_sid
    description: Server-assigned; a webhook is addressed through its owning record
    update:
      readOnly: true

  # ---- what the server accepts once ---------------------------------------
  #
  # x-immutable is readOnly's sibling: a property the API takes on create and
  # refuses on update. The three below are guarded by hand in the
  # implementation --
  #
  #   lib/routes/api/accounts.js:521
  #     if (req.body.service_provider_sid) throw ... 'service_provider_sid may not be modified'
  #   lib/routes/api/phone-numbers.js:72-73
  #     if (req.body.voip_carrier_sid) throw ... 'voip_carrier_sid may not be modified'
  #     if (req.body.number)           throw ... 'number may not be modified'
  #
  # -- and the spec says nothing about it, so cmd/gen sent them in the PUT body
  # like any other property and every update of an account or a phone number
  # failed, whether or not the value had changed:
  #
  #   Error: Unexpected status
  #     with jambonz_phone_number.test
  #     {"msg":"voip_carrier_sid may not be modified"}
  #
  # The generated acceptance tests found all three on their first run.
  #
  # Saying it here does two things at once: the property leaves the update body,
  # and an attribute in the create body and not the update body is precisely
  # cmd/gen's definition of ForceNew -- so changing one now plans as a
  # replacement, which is the only way the API will honour it.
  - target: $.components.schemas.Account.properties.service_provider_sid
    description: Accepted on create, rejected on update; changing it replaces the account
    update:
      x-immutable: true

  - target: $.components.schemas.PhoneNumber.properties.voip_carrier_sid
    description: Accepted on create, rejected on update; changing it replaces the number
    update:
      x-immutable: true

  - target: $.components.schemas.PhoneNumber.properties.number
    description: Accepted on create, rejected on update; changing it replaces the number
    update:
      x-immutable: true

  # ---- secrets -------------------------------------------------------------
  #
  # tfplugingen-openapi marks an attribute sensitive from `format: password`, and
  # sensitive here means exactly one thing: Terraform redacts the value in plan
  # and state output. It does not change how the value is read back. This API
  # answers every read with `SELECT * from <table>`, so a password column is
  # returned on every read — null when it was never set — and cmd/gen reads it
  # like any other column.
  - target: $.components.schemas.Webhook.properties.password
    description: Basic-auth secret for the webhook
    update:
      format: password

  - target: $.components.schemas.VoipCarrier.properties.register_password
    description: SIP registration secret
    update:
      format: password

  - target: $.components.schemas.VoipCarrier.properties.inbound_auth_password
    description: Inbound challenge secret
    update:
      format: password

  - target: $.paths['/VoipCarriers'].post.requestBody.content['application/json'].schema.properties.register_password
    description: SIP registration secret
    update:
      format: password

  - target: $.paths['/VoipCarriers'].post.requestBody.content['application/json'].schema.properties.inbound_auth_password
    description: Inbound challenge secret
    update:
      format: password

  # ---- where the spec and the implementation disagree ----------------------
  #
  # PUT /VoipCarriers/{sid} documents a 204 that carries a VoipCarrier body. 204
  # means no content, and the API sends none — the sibling PUTs all declare the
  # bare 204 this one should. Left as written, cmd/gen would bind the update to a
  # response field oapi-codegen never populates.
  - target: $.paths['/VoipCarriers/{VoipCarrierSid}'].put.responses['204']
    description: 204 No Content carries no body, and this endpoint sends none
    remove: true

  - target: $.paths['/VoipCarriers/{VoipCarrierSid}'].put.responses
    description: Restore the bare 204 the sibling update operations declare
    update:
      "204":
        description: voip carrier updated

  # A create body and its record schema have to describe the same resource, or an
  # attribute is settable and never read back (a permanent diff) or readable and
  # never settable (silently dropped on create). These four are columns the API
  # stores and returns; the record schema simply omits them.
  - target: $.components.schemas.VoipCarrier.properties
    description: Registration options carried by the create body but missing from the record
    update:
      register_use_tls:
        type: boolean
        description: whether to REGISTER over TLS
      register_from_user:
        type: string
        description: optional username to apply in the From header
      register_from_domain:
        type: string
        description: optional domain to apply in the From header
      register_public_ip_in_contact:
        type: boolean
        description: if true, use our public ip in the Contact header; otherwise the sip realm

  # The reverse: fields the record carries and the create body omits. Terraform
  # sets them at create or not at all, so the body has to accept them.
  - target: $.paths['/VoipCarriers'].post.requestBody.content['application/json'].schema.properties
    description: Fields the VoipCarrier record carries that the create body omitted
    update:
      is_active:
        type: integer

  # ---- booleans the API answers as numbers ---------------------------------
  #
  # Every one of these is a tinyint(1) column, and jambonz hands the row back
  # with 0 or 1 rather than false or true. The spec says boolean, so the
  # generated client unmarshals into a Go bool and the read fails:
  #
  #   json: cannot unmarshal number into Go struct field
  #   VoipCarrier.e164_leading_plus of type bool
  #
  # Declaring them integer describes what the server actually sends. It costs
  # the Terraform attribute its bool type -- these are 1/0 in a resource block,
  # not true/false -- which is the honest trade: a bool that cannot survive a
  # read is worse than a number that can.
  - target: $.components.schemas.VoipCarrier.properties
    description: tinyint(1) columns, answered as numbers
    update:
      e164_leading_plus:
        type: integer
      requires_register:
        type: integer
      is_active:
        type: integer
      # These two are booleans on the create body and nowhere in the record, so
      # the glue read them back as bools while sending ints and would not
      # compile:
      #
      #   voip_carrier_resource.go:185: bool does not satisfy integer
      #
      # Both sides of a field have to agree, whichever way it is declared.
      register_use_tls:
        type: integer
      register_public_ip_in_contact:
        type: integer

  - target: $.components.schemas.SipGateway.properties
    description: tinyint(1) columns, answered as numbers
    update:
      inbound:
        type: integer
      outbound:
        type: integer

  - target: $.paths['/VoipCarriers'].post.requestBody.content['application/json'].schema.properties
    description: The create body's copies of the same tinyint columns
    update:
      e164_leading_plus:
        type: integer
      requires_register:
        type: integer
      register_use_tls:
        type: integer
      register_public_ip_in_contact:
        type: integer

  - target: $.paths['/SipGateways'].post.requestBody.content['application/json'].schema.properties
    description: The create body's copies of the same tinyint columns
    update:
      is_active:
        type: integer
      inbound:
        type: integer
      outbound:
        type: integer

  # The same gap on SipGateway, and the same failure: is_active is a column in
  # sip_gateways, the create body takes it, `SELECT *` returns it, and the record
  # schema does not declare it. A gateway that leaves is_active out of its
  # resource block plans it as unknown, and nothing in the read can settle it:
  #
  #   Provider returned invalid result object after apply: ... still indicated
  #   an unknown value for jambonz_sip_gateway.livekit.is_active
  #
  # tinyint(1), so integer here for the same reason as its siblings above.
  - target: $.components.schemas.SipGateway.properties
    description: The create body takes is_active; the record omitted it
    update:
      is_active:
        type: integer
        description: whether the gateway is active

  # And the same gap the other way round: the create body takes app_json and the
  # Application record does not declare it, though the column exists and the API
  # returns it. Without this the attribute is Optional+Computed with nothing to
  # read it back from, so apply ends with
  #
  #   Provider returned invalid result object after apply: ... still indicated
  #   an unknown value for jambonz_application.pipecat.app_json
  #
  # Every computed attribute has to be known once apply returns, and the only
  # way to know this one is to read it.
  - target: $.components.schemas.Application.properties
    description: The create body takes app_json; the record omitted it
    update:
      app_json:
        type: string
        description: Voice Application Json, call_hook will not be invoked if app_json is provided

  - target: $.paths['/Accounts'].post.requestBody.content['application/json'].schema.properties
    description: The Account record carries device_calling_application_sid; the create body omitted it
    update:
      device_calling_application_sid:
        type: string
        format: uuid
        nullable: true

  # queue_event_hook is the other direction and cannot be fixed the same way: the
  # create body accepts it, the Account record does not return it, and a value
  # Terraform can write but never read is a diff on every plan. Dropping it from
  # the body is the honest half — the alternative is asserting a response field
  # this spec does not document.
  - target: $.paths['/Accounts'].post.requestBody.content['application/json'].schema.properties.queue_event_hook
    description: Accepted on create but absent from the Account record; unmanageable as written
    remove: true

  # SipGateway's create body omits netmask, which the record both requires and
  # returns — a gateway created through Terraform would take the server default
  # and then read back as drift.
  - target: $.paths['/SipGateways'].post.requestBody.content['application/json'].schema.properties
    description: netmask is required by the record and missing from the create body
    update:
      netmask:
        type: number
        description: CIDR prefix length for the gateway network
