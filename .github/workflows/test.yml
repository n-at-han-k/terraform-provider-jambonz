# Terraform Provider testing workflow.
#
# Almost every Go file in internal/ is generated from codegen/openapi.yaml, so the
# job that matters most here is `regenerate`: it runs the whole pipeline and fails
# if the committed output and the spec disagree. Everything else — the build, the
# linters, the acceptance tests — is checking code that regeneration would replace.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@051d91933864810ecd5e2ea2cfd98f6a5bca5347 # v6.3.2
        with:
          version: latest

  # The generator has its own module and its own tests. They are what hold the
  # contract between generator_config.yml and the overlay — a disagreement there
  # is otherwise a compile error two stages downstream, in generated code.
  tooling:
    name: Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'codegen/tooling/go.mod'
          cache: true
          cache-dependency-path: codegen/tooling/go.sum
      - name: go vet
        working-directory: codegen/tooling
        env:
          GOWORK: 'off'
        run: go vet ./...
      - name: go test
        working-directory: codegen/tooling
        env:
          GOWORK: 'off'
        run: go test ./...

  # `make verify` is the whole pipeline plus a git diff: stage 3 (the overlay),
  # 4a (the IR), 4a' (normalisation), 4b (schema and models), 4c (the HTTP
  # client), 4d (the CRUD glue), then tfplugindocs. Any file it produces that is
  # not already committed is a failure — the committed output is the reviewable
  # artifact, and it is only reviewable if it is what the spec says.
  regenerate:
    name: Regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # Stage 3 applies the OpenAPI overlay with openapi-format. Node is in this
      # repository for that and nothing else.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
      # tfplugindocs renders the documentation by asking a real Terraform CLI for
      # the provider's schema.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Cache the generator binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/bin
          key: tfplugingen-${{ runner.os }}-${{ hashFiles('GNUmakefile') }}
      - run: make verify

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - '1.9.*'
          - '1.10.*'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
