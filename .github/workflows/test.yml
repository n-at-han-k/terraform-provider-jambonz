# Terraform Provider testing workflow.
#
# Almost every Go file in internal/ is generated from codegen/openapi.yaml, so the
# job that matters most here is `regenerate`: it runs the whole pipeline and
# reconciles the committed output with the spec. Everything else — the build, the
# linters, the acceptance tests — is checking code that regeneration would replace.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

# Read, except in `regenerate`, which commits the pipeline's output back and
# raises its own permissions to do it.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      # golangci-lint v2 only. v1 topped out at a binary built with Go 1.24, which
      # refuses to run against a module targeting a newer Go than itself.
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  # The generator has its own module and its own tests. They are what hold the
  # contract between generator_config.yml and the overlay — a disagreement there
  # is otherwise a compile error two stages downstream, in generated code.
  tooling:
    name: Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'codegen/tooling/go.mod'
          cache: true
          cache-dependency-path: codegen/tooling/go.sum
      - name: go vet
        working-directory: codegen/tooling
        env:
          GOWORK: 'off'
        run: go vet ./...
      - name: go test
        working-directory: codegen/tooling
        env:
          GOWORK: 'off'
        run: go test ./...

  # The whole pipeline: stage 3 (the overlay), 4a (the IR), 4a' (normalisation),
  # 4b (schema and models), 4c (the HTTP client), 4d (the CRUD glue), then
  # tfplugindocs.
  #
  # On a push it REGENERATES AND COMMITS. The committed output is the reviewable
  # artifact and it is only reviewable if it is what the spec says — but the
  # docs in particular come out of a tool chain (a real Terraform CLI, answering
  # a schema request) that not every contributor will have to hand, and a red
  # build saying "you forgot to run make docs" is a chore the machine can simply
  # do. So it does, and pushes the result.
  #
  # On a pull request it still just fails. A fork's token cannot push here, and
  # a PR whose generated output disagrees with its spec is something a reviewer
  # should see rather than have quietly repaired.
  #
  # No loop: GitHub does not start a new workflow run for a push made with the
  # built-in GITHUB_TOKEN, so the commit this job makes does not re-trigger it.
  regenerate:
    name: Regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # To push the regenerated output back.
      contents: write
    # Two pushes in quick succession would otherwise race to commit
    # regenerations of different commits.
    concurrency:
      group: regenerate-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # Stage 3 applies the OpenAPI overlay with openapi-format. Node is in this
      # repository for that and nothing else.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
      # tfplugindocs renders the documentation by asking a real Terraform CLI for
      # the provider's schema.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Cache the generator binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/bin
          key: tfplugingen-${{ runner.os }}-${{ hashFiles('GNUmakefile') }}
      # `make spec gen docs` is `make verify` without its final git diff: spec
      # re-derives the IR from the overlay, gen renders, docs needs the
      # Terraform CLI installed above.
      - name: Regenerate
        run: make spec gen docs

      # Having just run the pipeline, the diff IS the question — so ask it
      # directly, and get the changed paths for the summary rather than a bare
      # exit code.
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated output already matches the spec." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "Regeneration changed:"
              echo '```'
              git status --porcelain
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A pull request is told, not fixed: see the job comment above.
      - name: Fail if a pull request is out of date
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          echo 'The committed output does not match the spec. Run `make gen docs` and commit the result.'
          git --no-pager diff
          exit 1

      - name: Commit the regenerated output
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Regenerate from the spec' \
                     -m "The pipeline's output for ${SHA}, committed by the Regenerate job."
          # HEAD:"$BRANCH" because actions/checkout leaves a detached HEAD on a
          # push event, and a bare `git push` from one has no upstream to go to.
          git push origin HEAD:"$BRANCH"

  # Run acceptance tests in a matrix with Terraform CLI versions.
  #
  # These need a live jambonz api-server, which test/docker-compose.yml provides:
  # the failures they cover — a value left unknown after apply, an attribute that
  # reads back differently from how it was written — are a conversation between
  # Terraform and a real server, and nothing short of one has that conversation.
  # The harness fails rather than skips when the server is missing, so a broken
  # testbed cannot pass as an empty suite.
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - '1.9.*'
          - '1.10.*'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      # --wait holds until every healthcheck passes and the two one-shot
      # services — the schema migration and the seed — have exited 0, so a
      # half-built database fails here rather than as a puzzling test error.
      - name: Start the api-server testbed
        run: docker compose -f test/docker-compose.yml up -d --wait
      - env:
          TF_ACC: "1"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
      - name: api-server logs
        if: failure()
        run: docker compose -f test/docker-compose.yml logs --no-color
      - name: Stop the testbed
        if: always()
        run: docker compose -f test/docker-compose.yml down -v
